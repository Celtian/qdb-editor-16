<a class="fixed z-100 bg-primary-container p-3" data-ui-skip-link href="#main-content"
  >Skip to content</a
>
<mat-toolbar>
  @if (compact()) {
    <button
      type="button"
      matIconButton
      aria-label="Open documentation navigation"
      (click)="mobileOpen.set(true)"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a data-ui-brand routerLink="/">
    <img ngSrc="qdb-editor-16-icon.png" width="30" height="30" alt="" priority />
    <span>QDB Editor 16</span>
    <small>Documentation</small>
  </a>
  <span data-ui-spacer></span>
  <a matButton href="https://github.com/Celtian/qdb-editor-16" target="_blank" rel="noopener">
    <mat-icon>code</mat-icon>
    GitHub
  </a>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav
    aria-label="Documentation navigation"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="opened()"
    (closedStart)="mobileOpen.set(false)"
  >
    <mat-nav-list>
      @for (page of pages; track page.path) {
        <a
          mat-list-item
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLink]="'/' + page.path"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobile()"
        >
          <mat-icon matListItemIcon>{{ page.icon }}</mat-icon>
          <span matListItemTitle>{{ page.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <main id="main-content" tabindex="-1"><router-outlet /></main>
    <footer>
      <strong>QDB Editor 16</strong>
      <span>Local-first FIFA 16 database editing.</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
