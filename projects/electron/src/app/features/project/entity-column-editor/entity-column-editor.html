<p [id]="instructionsId()">
  Choose and reorder the columns shown in the {{ entity() }} table. Drag a handle or focus it and
  use the Up and Down arrow keys.
</p>
<div
  class="qdb-column-list flex flex-col"
  cdkDropList
  cdkDropListLockAxis="y"
  role="list"
  [cdkDropListData]="orderedColumns()"
  (cdkDropListDropped)="drop($event)"
>
  @for (column of orderedColumns(); track column.key) {
    <div class="qdb-column-row" cdkDrag role="listitem" [cdkDragData]="column">
      <mat-checkbox
        [formField]="columnsForm[column.key]"
        (change)="setColumnVisibility(column, $event.checked)"
      >
        {{ column.label }}
      </mat-checkbox>
      <button
        class="flex-none cursor-grab text-on-surface-variant active:cursor-grabbing"
        cdkDragHandle
        matIconButton
        type="button"
        [attr.aria-label]="'Reorder ' + column.label + ' column'"
        [attr.aria-describedby]="instructionsId()"
        (keydown.arrowup)="moveColumn(column, -1); $event.preventDefault()"
        (keydown.arrowdown)="moveColumn(column, 1); $event.preventDefault()"
      >
        <mat-icon aria-hidden="true">drag_indicator</mat-icon>
      </button>
      <ng-template cdkDragPreview [matchSize]="true">
        <div
          class="qdb-column-drag-preview flex items-center justify-between rounded-lg bg-surface px-3 py-0 text-on-surface shadow-level3"
          aria-hidden="true"
        >
          <span>{{ column.label }}</span>
          <mat-icon>drag_indicator</mat-icon>
        </div>
      </ng-template>
    </div>
  }
</div>
<p
  class="qdb-live-announcement absolute size-px overflow-hidden whitespace-nowrap"
  aria-live="polite"
>
  {{ announcement() }}
</p>
