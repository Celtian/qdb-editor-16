<header
  class="sticky top-0 z-page-header m-0 grid w-full grid-cols-page-header items-center gap-4 border-b border-outline-variant bg-surface px-8 py-6 max-nav:grid-cols-page-header-compact max-nav:p-4"
  data-page-header
>
  <div
    class="grid size-16 place-items-center rounded-2xl bg-primary-container text-on-primary-container max-nav:size-14"
    data-page-header-icon
    aria-hidden="true"
  >
    <mat-icon class="size-8 text-3xl">{{ icon() }}</mat-icon>
  </div>
  <div class="flex min-w-0 items-center gap-3">
    <div class="min-w-0">
      <ng-content select="[pageHeaderContent]" />
    </div>
    <div class="flex-none" data-page-header-title-action>
      <ng-content select="[pageHeaderTitleAction]" />
    </div>
  </div>
  <div
    class="flex flex-wrap items-center justify-end gap-2 max-nav:col-span-full max-nav:justify-start"
    data-page-header-actions
  >
    <ng-content select="[pageHeaderActions]" />
  </div>
</header>
