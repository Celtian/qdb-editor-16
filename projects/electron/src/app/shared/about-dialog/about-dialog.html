<div
  class="grid grid-cols-dialog-header items-center gap-5 px-8 pt-9 pb-3 max-tiny:grid-cols-dialog-header-compact max-tiny:gap-detail-gap max-tiny:px-5 max-tiny:pt-6 max-tiny:pb-3"
>
  <img
    class="block rounded-2xl bg-sidebar max-tiny:size-15"
    ngSrc="qdb-downloader.png"
    width="72"
    height="72"
    alt=""
    priority
  />
  <div class="min-w-0" data-product-heading>
    <h2 class="max-tiny:text-2xl" mat-dialog-title>QDB Downloader</h2>
    <p
      class="mx-0 mt-tight mb-0 text-version text-on-surface-variant max-tiny:text-base"
      data-version
    >
      Version {{ version }}
    </p>
  </div>
  <button
    class="self-start"
    matIconButton
    mat-dialog-close
    type="button"
    aria-label="Close About dialog"
  >
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p class="m-0 text-base leading-docs text-on-surface" data-description>
    Local-first desktop app for creating date-based football-data snapshots from Transfermarkt,
    Soccerway, and WorldFootball.
  </p>
  <p class="mx-0 mt-5 mb-0 text-on-surface-variant">
    © {{ currentYear }} {{ author }} · MIT License
  </p>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton mat-dialog-close type="button">Close</button>
  <div class="flex items-center gap-2" data-external-actions>
    <a
      matButton
      href="https://celtian.github.io/qdb-downloader/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Documentation (opens in the system browser)"
    >
      <mat-icon aria-hidden="true">menu_book</mat-icon>
      Documentation
    </a>
    <a
      matButton="filled"
      href="https://github.com/Celtian/qdb-downloader"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub (opens in the system browser)"
    >
      <mat-icon aria-hidden="true">code</mat-icon>
      GitHub
    </a>
  </div>
</mat-dialog-actions>
